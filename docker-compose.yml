
# 단일 진입점: 호스트에는 proxy만 노출한다. DB 볼륨 이름은 기존 설정을 유지한다.
services:
  proxy:
    build: ./nginx
    image: revcc-proxy:assignment
    container_name: revcc-proxy
    ports:
      - "${REVCC_PORT:-8090}:80"
    depends_on:
      frontend:
        condition: service_healthy
      core:
        condition: service_healthy
      board:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
  frontend:
    build: ./assignment-frontend
    image: revcc-frontend:assignment
    container_name: revcc-frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
  core:
    build: ./backend
    image: revcc-core:assignment
    container_name: revcc-core
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT:-5432}/${DB_NAME}?sslmode=require
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-revcc-local-redis}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      PASSWORD_RESET_SECRET: ${PASSWORD_RESET_SECRET:-}
      WITHDRAWAL_HMAC_SECRET: ${WITHDRAWAL_HMAC_SECRET:-}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-http://localhost:8090/password-reset}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:-http://localhost:8090/api/auth/kakao/callback}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/vehicles"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
  board:
    build: ./board-service
    image: revcc-board:assignment
    container_name: revcc-board
    environment:
      PGHOST: ${DB_HOST}
      PGPORT: ${DB_PORT:-5432}
      PGDATABASE: ${DB_NAME}
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      PGSSLMODE: require
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-revcc-local-redis}
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: revcc-redis
    # 세션 저장소라 인증을 요구한다. 로컬 기본값은 편의용이고 운영(prod 오버레이)은 REDIS_PASSWORD를 강제한다.
    # 비밀번호는 명령줄 인자(ps에 보임) 대신 설정 파일로 넘긴다. 영문·숫자로 만든다(예: openssl rand -hex 32).
    command: ["sh", "-c", "printf 'requirepass \"%s\"\\n' \"$$REDIS_PASSWORD\" > /tmp/redis.conf && exec redis-server /tmp/redis.conf"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-revcc-local-redis}
      REDISCLI_AUTH: ${REDIS_PASSWORD:-revcc-local-redis}
    healthcheck:
      # redis-cli는 NOAUTH 오류에도 0으로 끝날 수 있어 PONG 응답을 직접 확인한다.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
  postgres:
    image: postgres:16
    container_name: revcc-postgres
    environment:
      POSTGRES_DB: revcc
      POSTGRES_USER: revcc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-revcc}
    volumes:
      - revcc_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revcc -d revcc"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  # 기존 revcc-site_revcc_pg를 재사용한다. down -v는 데이터를 삭제하므로 금지.
  revcc_pg:

# 기본 네트워크를 명시적인 사용자 정의 bridge로 만들어 inspect 시연이 가능하다.
# 모든 서비스가 이 네트워크에 자동 연결되며 호스트 공개 포트는 proxy에만 있다.
networks:
  default:
    name: revcc-network
    driver: bridge
