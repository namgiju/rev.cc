server:
  port: 8080
  # nginx가 X-Forwarded-For로 실제 클라이언트 IP를 전달하므로 request.getRemoteAddr()에 반영한다
  # (rate limit이 프록시 IP 하나로 뭉치지 않고 클라이언트별로 정확히 적용되기 위해 필요하다).
  forward-headers-strategy: framework
  tomcat:
    # form 요청 본문 상한. 이 API는 JSON만 받으므로 작게 둔다(JSON 본문은 app.request에서 제한).
    max-http-form-post-size: 64KB
spring:
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  datasource:
    # 로컬 개발 기본값. Compose에서는 컨테이너 DNS 이름으로 덮어쓴다.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/revcc}
    username: ${POSTGRES_USER:revcc}
    password: ${POSTGRES_PASSWORD:revcc}
    # 커넥션 풀. 운영 DB(Neon, 2026-09-30 확인 max_connections 901, 일반 사용자 가용 897)에
    # core 10 + board 10 = 평시 최대 20, 재배포로 구·신 컨테이너가 겹쳐도 40만 쓴다.
    # 풀이 다 차면 무한 대기하지 않고 connection-timeout 뒤 503으로 끝낸다(DatabaseUnavailableHandler).
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:300000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
      # connection-timeout은 연결을 얻을 때만 적용된다. 이미 열린 연결에서 DB가 멈추면 pgjdbc 기본값
      # (socketTimeout=0)으로는 쿼리가 무한히 기다리므로 소켓 읽기 제한(초)을 둔다. 초과하면 연결은 폐기된다.
      data-source-properties:
        socketTimeout: ${DB_SOCKET_TIMEOUT_S:15}
  # 스키마는 Flyway(db/migration)만 변경하고 Hibernate는 엔티티와 일치하는지 검증만 한다.
  # 테이블이 이미 있는 기존 DB는 V1을 실행하지 않고 baseline(V1)으로 기록한 뒤 V2부터 적용한다.
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      # 비어 있으면 인증 없이 접속한다(CI·격리 테스트용 무인증 Redis). Compose는 항상 값을 넘긴다.
      password: ${REDIS_PASSWORD:}
# Spring Session의 Java 직렬화 대신 Express도 읽을 수 있는 JSON 계약을 사용한다.
app:
  request:
    # JSON 본문 상한(BodySizeLimitFilter). 초과하면 역직렬화 전에 413으로 거부한다.
    max-body-size: 64KB
    # 차량 인증서류 업로드 전용 상한: base64 최대 4.2MB + JSON 여유분, nginx client_max_body_size(5m)와 동일.
    max-upload-size: 5MB
  password-reset:
    secret: ${PASSWORD_RESET_SECRET:}
  # 회원 탈퇴 재가입 제한 HMAC 키(WithdrawalBlocks). 비어 있으면 탈퇴를 받지 않는다(503). prod 프로파일은 필수다.
  withdrawal:
    hmac-secret: ${WITHDRAWAL_HMAC_SECRET:}
  mail:
    from: ${SMTP_FROM:}
    reset-url: ${PASSWORD_RESET_URL:http://localhost:8090/password-reset}
  session:
    secure: ${SESSION_COOKIE_SECURE:false}
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8090/api/auth/kakao/callback}

# Request/response bodies can contain passwords and one-time reset credentials.
logging:
  level:
    org.springframework.web: INFO
    org.springframework.mail: INFO
    org.hibernate.orm.jdbc.bind: OFF
