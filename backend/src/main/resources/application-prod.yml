# 운영 배포 프로파일. SPRING_PROFILES_ACTIVE=prod로 활성화한다(docker-compose.prod.yml 참고).
# 로컬 개발 기본값(application.yml)과 분리해 두 가지를 절대 허용하지 않는다:
#  - 세션 쿠키가 Secure 없이 나가는 것 (환경변수로 되돌릴 수 없도록 값을 고정한다)
#  - POSTGRES_PASSWORD 없이 기동되는 것 (기본값을 두지 않아 누락 시 기동에 실패한다)
spring:
  datasource:
    password: ${POSTGRES_PASSWORD}
app:
  session:
    secure: true
