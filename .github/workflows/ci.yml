# Spring(core)과 Node(board) 테스트를 push/PR마다 자동 실행한다.
# 로컬에서 쓰는 명령(mvn test, npm test)을 그대로 쓰고, 버전은 각 Dockerfile과 맞춘다
# (maven:3.9.9-eclipse-temurin-23, node:22-alpine).
name: CI

on:
  push:
    branches: [docker-assignment, main]
  pull_request:
    branches: [docker-assignment, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Spring tests (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 통합 테스트(MemberFlowIntegrationTest, PasswordResetServiceTest)는 아래 두 환경변수가
    # 있을 때만 실행된다. CI 전용 일회성 DB라 비밀번호는 시크릿이 아니다.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: revcc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d revcc_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      REVCC_TEST_DB_PORT: "5432"
      REVCC_TEST_REDIS_PORT: "6379"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "23"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B test

  board:
    name: Node tests (board-service)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: board-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: board-service/package-lock.json
      - run: npm ci
      - run: npm test
