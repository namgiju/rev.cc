server {
    listen 80;
    server_name localhost;

    # /home, /admin는 디렉터리(index.html)라서 슬래시 없이 요청하면 nginx가
    # 자동으로 308/301 리다이렉트를 만드는데, 이때 프록시 앞단 Host 헤더에서
    # 포트가 빠져 있으면 잘못된 주소로 튄다. 정확한 경로를 직접 매칭해 리다이렉트 자체를 없앤다.
    location = /home {
        root /usr/share/nginx/html;
        try_files /home/index.html =404;
    }
    location = /admin {
        root /usr/share/nginx/html;
        try_files /admin/index.html =404;
    }
    location = /community {
        root /usr/share/nginx/html;
        try_files /community/index.html =404;
    }
    location = /garage {
        root /usr/share/nginx/html;
        try_files /garage/index.html =404;
    }
    location = /parts {
        root /usr/share/nginx/html;
        try_files /parts/index.html =404;
    }
    # 게시글 상세 canonical URL. /community/index.html이 pathname을 읽어 목록 대신
    # 상세를 그려준다(SPA 프레임워크 없이, /api/*는 이 파일과 무관해 영향 없음).
    location ~ ^/community/(free|maintenance|parts|drive)/[0-9]+$ {
        root /usr/share/nginx/html;
        try_files /community/index.html =404;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
