<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REV.CC | 비밀번호 재설정</title>
<link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/auth.css"><script src="/js/password-reset.js" defer></script></head>
<body class="auth-page"><main class="auth-shell"><section class="auth-panel" aria-labelledby="auth-title">
<a href="/" class="auth-logo"><img src="/img/logo.png" alt="REV.CC" width="140"></a><div class="auth-content">
<p class="auth-eyebrow">DRIVE · SHARE · CONNECT</p><h1 id="auth-title">비밀번호 재설정</h1><p class="auth-description">가입 시 등록된 이메일로 인증해주세요.<br>카카오 계정은 카카오 로그인을 이용해주세요.</p>
<p id="auth-message" class="auth-message" role="status" tabindex="-1" hidden></p>
<form id="email-form"><label for="reset-email">이메일</label><input id="reset-email" type="email" maxlength="254" autocomplete="email" required><button class="auth-submit" type="submit">인증번호 받기 / 재발송</button></form>
<form id="code-form" hidden><label for="reset-code">6자리 인증번호</label><input id="reset-code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required><p class="field-help">인증번호는 5분 동안 유효합니다. 재발송은 60초 후 가능합니다.</p><button class="auth-submit" type="submit">인증하기</button></form>
<form id="password-form" hidden><label for="new-password">새 비밀번호</label><input id="new-password" type="password" autocomplete="new-password" maxlength="255" required><label for="new-confirm">새 비밀번호 확인</label><input id="new-confirm" type="password" autocomplete="new-password" maxlength="255" required><p class="field-help">공백만으로 구성할 수 없으며 UTF-8 72바이트 이하입니다. 인증 후 10분 안에 변경해주세요.</p><button class="auth-submit" type="submit">비밀번호 변경</button></form>
<p class="auth-switch"><a href="/password-reset">처음부터 다시 인증</a> · <a href="/login">로그인으로 돌아가기 →</a></p></div><p class="auth-copyright">© 2026 REV.CC · 차로 연결되는 일상</p></section></main></body></html>
