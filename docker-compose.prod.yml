# 운영 배포용 오버레이. 로컬 개발 오버레이(override.yml, dev.yml)와 분리해 약한 기본값을
# 운영에서는 절대 허용하지 않는다: docker-compose.yml에는 로컬 편의용 기본값이 남아있지만,
# 이 파일을 얹으면 값이 없을 때 기동 자체가 실패한다.
#
# 운영 DB는 Neon이다. core/board는 .env의 DB_*만 사용하고, 로컬 postgres 서비스와 그 볼륨은
# 이 오버레이에서 병합 결과 자체에서 제거한다(!reset, !override는 Docker Compose 2.24 이상 필요).
#
# 네트워크는 역할별로 나눈다(과제용 docker-compose.yml의 단일 revcc-network는 그대로 둔다).
#   edge: proxy ↔ frontend                (internal: 외부 통신 불필요)
#   app : proxy ↔ core/board              (일반 bridge: core/board가 Neon·Kakao·SMTP로 나가는 경로)
#   data: core/board ↔ redis              (internal: redis는 외부와 통신하지 않는다)
#   tunnel: cloudflared ↔ proxy          (cloudflared는 고정 주소 172.16.238.2, 다른 서비스는 붙지 않는다)
# frontend와 proxy는 data에 없어 redis에 닿지 않고, redis는 edge/app에 없다.
#
# 외부 진입은 Cloudflare Named Tunnel 하나뿐이다:
#   사용자 → rev.cc(Cloudflare DNS·HTTPS 종단) → Named Tunnel → cloudflared → proxy → frontend/core/board
# cloudflared가 Cloudflare로 나가는 연결을 먼저 맺으므로 호스트에 열어 둘 포트가 없다. 그래서 proxy의
# 호스트 포트 게시(docker-compose.yml의 REVCC_PORT)를 병합 결과에서 없앤다 — Docker가 게시한 포트는
# 호스트 방화벽(ufw 등)을 우회해 인터넷에 열리므로, 남겨 두면 Cloudflare를 거치지 않는 경로가 생긴다.
# nginx는 172.16.238.2에서 온 연결만 Cloudflare 경유로 보고 CF-Connecting-IP로 실제 사용자 IP를 복원한다
# (nginx/default.conf의 set_real_ip_from과 같은 값이어야 한다. scripts/nginx-forwarded-check.sh가 대조).
# Cloudflare Dashboard의 tunnel Public Hostname은 rev.cc → http://proxy:80 으로 설정한다.
#
# 운영 서비스는 프로세스가 죽거나 호스트가 재부팅되면 자동으로 다시 시작한다(restart: unless-stopped).
# docker compose stop/down으로 멈춘 것은 다시 올리지 않는다. 과제용 docker-compose.yml에는 두지 않는다.
# 참고: Docker는 healthcheck가 unhealthy라는 이유만으로는 재시작하지 않는다(프로세스 종료 시에만).
#
# 사용: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --wait
services:
  proxy:
    restart: unless-stopped
    ports: !reset []
    networks: [edge, app, tunnel]
  cloudflared:
    # 버전을 고정한다(자동 업데이트 끔). 올릴 때는 태그만 바꿔 다시 배포한다.
    image: cloudflare/cloudflared:2026.9.3
    # 원격 관리(Dashboard) tunnel: 라우팅(Public Hostname)은 Dashboard에서 정하고 여기서는 토큰만 쓴다.
    command: ["tunnel", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN(Cloudflare Named Tunnel 토큰)을 설정해야 배포할 수 있습니다.}
      # /ready(healthcheck)용 metrics는 컨테이너 안에서만 연다.
      TUNNEL_METRICS: 127.0.0.1:20241
    restart: unless-stopped
    depends_on:
      proxy:
        condition: service_healthy
    healthcheck:
      # Cloudflare 엣지와 연결이 하나 이상 맺어져 있으면 성공한다.
      test: ["CMD", "cloudflared", "tunnel", "ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      tunnel:
        ipv4_address: 172.16.238.2
  # 운영 화면은 Next.js(frontend/)다. 레거시 assignment-frontend는 과제용 docker-compose.yml에만 남는다.
  # 서비스 이름과 포트(frontend:80)를 그대로 써서 nginx 설정은 바꾸지 않는다(node 사용자도 컨테이너
  # 안에서는 Docker 기본 sysctl로 80을 열 수 있다). SSR fetch는 edge 네트워크의 proxy를 거쳐 API로 간다.
  frontend:
    build: ./frontend
    image: revcc-frontend:next
    restart: unless-stopped
    networks: [edge]
    environment:
      PORT: "80"
      REVCC_API_ORIGIN: http://proxy
    # 기본 healthcheck(GET /)는 메인 SSR이 proxy를 호출하는데, proxy는 frontend가 healthy해야 뜬다.
    # API를 부르지 않는 /login으로 검사해 순환 대기를 피한다.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/login"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
  postgres: !reset null
  redis:
    restart: unless-stopped
    networks: [data]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD 환경변수를 설정해야 배포할 수 있습니다.}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD 환경변수를 설정해야 배포할 수 있습니다.}
  core:
    restart: unless-stopped
    networks: [app, data]
    environment:
      # DB 커넥션 풀(Hikari). 기본값은 application.yml(최대 10, 최소 유휴 2, 연결 대기 5초).
      DB_POOL_MAX: ${CORE_DB_POOL_MAX:-10}
      DB_POOL_MIN_IDLE: ${CORE_DB_POOL_MIN_IDLE:-2}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-5000}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:?DB_HOST(Neon 호스트)를 설정해야 배포할 수 있습니다.}:${DB_PORT:-5432}/${DB_NAME:?DB_NAME을 설정해야 배포할 수 있습니다.}?sslmode=require
      POSTGRES_USER: ${DB_USER:?DB_USER를 설정해야 배포할 수 있습니다.}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 설정해야 배포할 수 있습니다.}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD 환경변수를 설정해야 배포할 수 있습니다.}
      SPRING_PROFILES_ACTIVE: prod
      # 회원 탈퇴 재가입 제한 HMAC 키(32자 이상). 바꾸면 기존 제한이 풀리므로 docs/member-withdrawal.md 절차를 따른다.
      WITHDRAWAL_HMAC_SECRET: ${WITHDRAWAL_HMAC_SECRET:?WITHDRAWAL_HMAC_SECRET(32자 이상 난수)을 설정해야 배포할 수 있습니다.}
      # docker-compose.yml의 로컬 기본값(localhost:8090 콜백)이 운영에 조용히 섞여 들어가지 않도록
      # 명시적인 실제 콜백 URL(https://rev.cc/api/auth/kakao/callback 등)을 강제한다.
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:?KAKAO_REDIRECT_URI 환경변수(운영 도메인의 https 콜백 URL)를 설정해야 배포할 수 있습니다.}
    # 로컬 postgres를 제거했으므로 그 의존성도 뺀다(Neon은 compose 밖의 서비스다).
    depends_on: !override
      redis:
        condition: service_healthy
  board:
    restart: unless-stopped
    networks: [app, data]
    environment:
      # DB 커넥션 풀(pg.Pool). 기본값은 src/db-pool.js(최대 10, 유휴 30초, 연결 대기 5초).
      PG_POOL_MAX: ${BOARD_DB_POOL_MAX:-10}
      PG_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-5000}
      PGHOST: ${DB_HOST:?DB_HOST(Neon 호스트)를 설정해야 배포할 수 있습니다.}
      PGDATABASE: ${DB_NAME:?DB_NAME을 설정해야 배포할 수 있습니다.}
      PGUSER: ${DB_USER:?DB_USER를 설정해야 배포할 수 있습니다.}
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 설정해야 배포할 수 있습니다.}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD 환경변수를 설정해야 배포할 수 있습니다.}
volumes:
  revcc_pg: !reset null
networks:
  edge:
    internal: true
  app: {}
  data:
    internal: true
  tunnel:
    # cloudflared가 Cloudflare로 나가야 하므로 internal이 아니다. 고정 주소는 동적 할당 범위(ip_range) 밖에 둬
    # proxy가 먼저 떠도 172.16.238.2를 가져가지 못하게 한다. Docker 기본 주소 풀(172.17~31, 192.168) 밖 대역이다.
    ipam:
      config:
        - subnet: 172.16.238.0/28
          ip_range: 172.16.238.8/29
