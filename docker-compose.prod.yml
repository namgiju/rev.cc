# 운영 배포용 오버레이. 로컬 개발 오버레이(override.yml, dev.yml)와 분리해 약한 기본값을
# 운영에서는 절대 허용하지 않는다: docker-compose.yml에는 로컬 편의용 기본값이 남아있지만,
# 이 파일을 얹으면 값이 없을 때 기동 자체가 실패한다.
#
# 운영 DB는 Neon이다. core/board는 .env의 DB_*만 사용하고, 로컬 postgres 서비스와 그 볼륨은
# 이 오버레이에서 병합 결과 자체에서 제거한다(!reset, !override는 Docker Compose 2.24 이상 필요).
#
# 네트워크는 역할별로 나눈다(과제용 docker-compose.yml의 단일 revcc-network는 그대로 둔다).
#   edge: proxy ↔ frontend                (internal: 외부 통신 불필요)
#   app : proxy ↔ core/board              (일반 bridge: core/board가 Neon·Kakao·SMTP로 나가는 경로)
#   data: core/board ↔ redis              (internal: redis는 외부와 통신하지 않는다)
# frontend와 proxy는 data에 없어 redis에 닿지 않고, redis는 edge/app에 없다.
#
# 사용: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --wait
services:
  proxy:
    networks: [edge, app]
  frontend:
    networks: [edge]
  postgres: !reset null
  redis:
    networks: [data]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD 환경변수를 설정해야 배포할 수 있습니다.}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD 환경변수를 설정해야 배포할 수 있습니다.}
  core:
    networks: [app, data]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:?DB_HOST(Neon 호스트)를 설정해야 배포할 수 있습니다.}:${DB_PORT:-5432}/${DB_NAME:?DB_NAME을 설정해야 배포할 수 있습니다.}?sslmode=require
      POSTGRES_USER: ${DB_USER:?DB_USER를 설정해야 배포할 수 있습니다.}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 설정해야 배포할 수 있습니다.}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD 환경변수를 설정해야 배포할 수 있습니다.}
      SPRING_PROFILES_ACTIVE: prod
      # docker-compose.yml의 로컬 기본값(localhost:8090 콜백)이 운영에 조용히 섞여 들어가지 않도록
      # 명시적인 실제 콜백 URL(https://rev.cc/api/auth/kakao/callback 등)을 강제한다.
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:?KAKAO_REDIRECT_URI 환경변수(운영 도메인의 https 콜백 URL)를 설정해야 배포할 수 있습니다.}
    # 로컬 postgres를 제거했으므로 그 의존성도 뺀다(Neon은 compose 밖의 서비스다).
    depends_on: !override
      redis:
        condition: service_healthy
  board:
    networks: [app, data]
    environment:
      PGHOST: ${DB_HOST:?DB_HOST(Neon 호스트)를 설정해야 배포할 수 있습니다.}
      PGDATABASE: ${DB_NAME:?DB_NAME을 설정해야 배포할 수 있습니다.}
      PGUSER: ${DB_USER:?DB_USER를 설정해야 배포할 수 있습니다.}
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 설정해야 배포할 수 있습니다.}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD 환경변수를 설정해야 배포할 수 있습니다.}
volumes:
  revcc_pg: !reset null
networks:
  edge:
    internal: true
  app: {}
  data:
    internal: true
