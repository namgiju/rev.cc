# 브라우저의 모든 API와 정적 파일은 동일 출처로 제공되어 같은 쿠키를 사용한다.
# JSON 변경 요청만 허용해 외부 사이트의 HTML form을 통한 CSRF를 차단한다.
map "$request_method:$content_type" $reject_form {
    default 0;
    "~*^(POST|PUT|PATCH):application/json(?:;|$)" 0;
    ~^(POST|PUT|PATCH): 1;
}
# 이 컨테이너는 항상 평문 80으로 listen한다(로컬 개발도, Cloudflare 등 앞단 리버스 프록시 뒤도 동일).
# 앞단이 실제로 받은 프로토콜을 X-Forwarded-Proto로 알려줄 때만 그 값을 백엔드에 그대로 전달하고,
# (로컬 직접 접속처럼) 헤더가 없으면 이 서버 자신의 스킴(http)으로 대체한다.
map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# --- 실제 클라이언트 IP 신뢰 경계 (운영: Cloudflare Named Tunnel) ---
# 운영 요청 경로: 사용자 → Cloudflare(HTTPS 종단) → Named Tunnel → cloudflared → 이 nginx.
# docker-compose.prod.yml은 proxy의 호스트 포트를 게시하지 않고, cloudflared를 proxy와 둘만 있는
# tunnel 네트워크에 고정 주소 172.16.238.2로 붙인다. 이 주소에서 온 연결만 Cloudflare를 거친 요청이다.
# (두 값은 반드시 같아야 한다. scripts/nginx-forwarded-check.sh가 대조한다.)
#
# 신뢰 근거(2026-09-30 Quick Tunnel로 Cloudflare 엣지 경유 실측):
#  - CF-Connecting-IP: Cloudflare가 만든다. 클라이언트가 이 헤더를 보내면 엣지가 요청을 거부한다(error 1000).
#  - X-Forwarded-For: 클라이언트가 보낸 값이 남고 Cloudflare가 뒤에 덧붙인다 → 신뢰하지 않는다.
#  - Forwarded, True-Client-IP, X-Forwarded-Host/Port/Ssl: 클라이언트 값이 그대로 통과한다 → 백엔드로 넘기지 않는다.
#  - X-Forwarded-Proto, CF-Visitor: Cloudflare가 실제 스킴으로 덮어쓴다.
# 따라서 cloudflared 주소에서 온 요청일 때만 CF-Connecting-IP로 $remote_addr를 바꾼다(realip 모듈).
# 그 밖의 주소(로컬 포트 접속, 다른 컨테이너)에서 온 CF-Connecting-IP는 무시되고 연결 주소가 그대로 쓰인다.
# 값이 IP 형식이 아니면 realip가 무시하고 cloudflared 주소가 남는다(모두 한 버킷 = 안전한 쪽으로 실패).
# X-Forwarded-For는 재귀 해석하지 않는다(real_ip_recursive off, 기본값).
set_real_ip_from 172.16.238.2;
real_ip_header CF-Connecting-IP;

# HSTS는 원요청이 HTTPS였다는 것을 Cloudflare가 알려준 경우에만 보낸다: 연결이 cloudflared에서 왔고
# ($realip_remote_addr = 바뀌기 전 연결 주소) X-Forwarded-Proto가 https일 때. 로컬 http나, 다른 곳에서
# X-Forwarded-Proto: https를 위조한 요청에는 값이 비어 헤더가 붙지 않는다.
# 초기 운영 단계라 max-age를 짧게(5분) 두고 includeSubDomains/preload는 쓰지 않는다.
# 문제가 없으면 1주(604800) → 1개월(2592000) 순으로 늘린다.
map "$realip_remote_addr:$http_x_forwarded_proto" $revcc_hsts {
    default "";
    "172.16.238.2:https" "max-age=300";
}

# --- rate limit (2차 안전망) ---
# 1차 방어는 애플리케이션 제한이다(core: 로그인·가입·아이디 확인 IP당 각 10/분 + 계정당 실패 5회/15분,
# 비밀번호 재설정 Redis 제한, board: 글·댓글·매물 등 사용자당, 조회수 IP당 60/분).
# nginx는 그보다 느슨하게 두어 정상 사용자는 앱 제한에 먼저 걸리고, 앱 버그나 대량 요청만 여기서 막는다.
# 키는 위 realip로 복원한 $remote_addr라 운영에서는 사용자별로, cloudflared 주소 하나로 뭉치지 않는다.
# 같은 공인 IP를 쓰는 사용자(통신사 NAT, 학교망)도 고려해 넉넉하게 잡았다.
#  - revcc_api : /api 전체, IP당 초당 20 + 순간 200(목록 페이지의 이미지 요청 등)
#  - revcc_auth: 로그인·가입·아이디 확인·비밀번호 재설정·카카오, IP당 분당 30 + 순간 30
#                (/api/auth/me, /api/auth/logout은 제외 — 페이지마다 호출된다)
map $uri $revcc_auth_limit_key {
    default "";
    ~^/api/auth/(login|signup|check-username|password-reset/|kakao/) $binary_remote_addr;
}
limit_req_zone $binary_remote_addr zone=revcc_api:10m rate=20r/s;
limit_req_zone $revcc_auth_limit_key zone=revcc_auth:10m rate=30r/m;
limit_req_status 429;
limit_req_log_level warn;

server {
    listen 80;
    server_name _;
    # 응답 헤더와 오류 페이지에 nginx 버전을 노출하지 않는다.
    server_tokens off;
    client_max_body_size 5m;

    # --- timeout ---
    # 클라이언트 쪽: 헤더는 15초, 본문·응답은 읽기/쓰기 사이 간격 30초(전체 전송 시간이 아니다 — 5MB 업로드도 해당 없음).
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 30s;
    # cloudflared는 origin 유휴 연결을 90초(keepAliveTimeout 기본값) 동안 재사용한다. nginx가 먼저 닫으면
    # 재사용 순간 연결이 끊겨 502가 날 수 있어 그보다 길게 둔다.
    keepalive_timeout 100s;
    # upstream(core/board/frontend)은 같은 Docker 네트워크라 연결은 즉시 된다.
    # 응답 대기는 앱 자체 제한보다 길게 둔다: DB 연결 대기 5초·쿼리 15초(STEP 8, 최악 약 20초), SMTP 각 5초.
    # 그래서 느린 요청은 앱이 먼저 503으로 끝내고, nginx 504는 앱이 멈췄을 때만 난다.
    # (Cloudflare 응답 대기 100초보다 짧아 사용자는 Cloudflare 524 대신 nginx 504를 받는다.)
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # 컨테이너 재시작으로 IP가 바뀌어도 Docker DNS를 다시 조회한다.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    # 값이 비면 nginx가 헤더를 생략한다(위 $revcc_hsts 참고).
    add_header Strict-Transport-Security $revcc_hsts always;
    # nginx가 직접 거부한 429도 앱 429와 같은 JSON 형태로 응답한다(앱이 보낸 429는 그대로 통과한다).
    error_page 429 /__revcc_rate_limited;
    if ($reject_form) { return 415; }
    # 앞단(Cloudflare 등)이 "원래 요청은 http였다"고 알려준 경우에만 https로 전환한다.
    # 로컬 개발은 이 헤더 자체가 없어(빈 문자열) 절대 걸리지 않으므로 http://localhost:8090은 그대로 동작한다.
    if ($http_x_forwarded_proto = "http") { return 301 https://$host$request_uri; }
    location = /health { access_log off; return 200 'ok'; }
    location = /__revcc_rate_limited {
        internal;
        default_type application/json;
        charset utf-8;
        charset_types application/json;
        return 429 '{"message":"요청이 너무 많습니다. 잠시 후 다시 시도해주세요."}';
    }
    # URI를 유지해 Express /api/board 및 /api/parts로 전달한다.
    location ~ ^/api/(board|parts)(/|$) {
        limit_req zone=revcc_api burst=200 nodelay;
        set $board_service board:3001;
        proxy_pass http://$board_service$request_uri;
        proxy_set_header Host $host;
        # 실제 클라이언트 IP를 전달한다(로그·rate limit에서 프록시 IP로 뭉치지 않도록).
        # 클라이언트가 보낸 X-Forwarded-For는 버리고 nginx가 본 주소 하나로 덮어쓴다(위조 방지).
        # 운영에서는 위 realip가 cloudflared 연결에 한해 CF-Connecting-IP로 바꾼 주소다.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Express가 trust proxy로 원래 요청 스킴(http/https)을 판단하는 데 쓴다.
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        # 클라이언트가 보낸 다른 전달 헤더는 넘기지 않는다(빈 값 = 헤더 제거). Cloudflare도 지우지 않는다.
        # Express trust proxy는 X-Forwarded-Host를 req.hostname으로 쓴다.
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header True-Client-IP "";
        proxy_set_header CF-Connecting-IP "";
    }
    location /api/ {
        limit_req zone=revcc_api burst=200 nodelay;
        limit_req zone=revcc_auth burst=30 nodelay;
        set $core_service core:8080;
        proxy_pass http://$core_service$request_uri;
        proxy_set_header Host $host;
        proxy_hide_header Access-Control-Allow-Origin;
        # core의 로그인/회원가입 rate limit이 클라이언트별로 정확히 동작하려면 실제 IP가 필요하다.
        # Spring(forward-headers-strategy: framework)은 X-Forwarded-For의 첫 값을 클라이언트 IP로 쓰므로
        # 클라이언트가 보낸 값을 덧붙이면 버킷을 마음대로 바꿀 수 있다. nginx가 본 주소 하나로 덮어쓴다.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Spring의 forward-headers-strategy: framework가 원래 요청 스킴을 판단하는 데 쓴다.
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        # Spring ForwardedHeaderFilter는 RFC 7239 Forwarded(for=)를 X-Forwarded-For보다 먼저 쓰고,
        # X-Forwarded-Host/Port/Prefix/Ssl로 요청 URL을 바꾼다. 클라이언트 값이 그대로 오므로 넘기지 않는다.
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header True-Client-IP "";
        proxy_set_header CF-Connecting-IP "";
    }
    location / {
        set $frontend_service frontend:80;
        proxy_pass http://$frontend_service$request_uri;
        proxy_set_header Host $host;
    }
}
