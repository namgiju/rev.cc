# 기존 HTML 사이트(8090)를 유지하며 Next.js 차고(3000)를 추가한다.
# docker compose -f docker-compose.yml -f docker-compose.garage.yml up -d --build --wait
services:
  garage-ui:
    build:
      context: ./frontend
      args:
        REVCC_API_ORIGIN: http://proxy
    image: revcc-garage-ui:local
    ports:
      - "127.0.0.1:${GARAGE_PORT:-3000}:3000"
    depends_on:
      proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/garage').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
